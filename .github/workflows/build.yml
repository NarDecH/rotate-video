name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Self-test and build (single file)
        shell: bash
        run: bash build.sh

      - name: Build portable folder and zip
        shell: bash
        run: bash build.sh onedir

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum RotateVideo.exe RotateVideo-portable.zip | sed 's/ \*/  /' > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RotateVideo-windows-x64
          path: |
            dist/RotateVideo.exe
            dist/RotateVideo-portable.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Portable Windows app that rotates and mirrors videos without losing quality.

          **Downloads**
          - `RotateVideo.exe` - single file, nothing to install (FFmpeg is embedded)
          - `RotateVideo-portable.zip` - folder build, starts faster

          Default mode only rewrites the rotation metadata (bitstream untouched).
          Optional modes bake the rotation into pixels, either pixel-exact lossless
          or high-quality CRF 16.

          **Licence:** application code is MIT. The bundled FFmpeg build is GPLv3;
          see THIRD-PARTY.md in the repository for source and obligations.

          The executable is not code-signed, so Windows SmartScreen may warn on the
          first run (More info -> Run anyway).
          EOF

          echo >> notes.md
          echo '**SHA-256 checksums** (`SHA256SUMS`)' >> notes.md
          echo >> notes.md
          echo '```' >> notes.md
          cat dist/SHA256SUMS >> notes.md
          echo '```' >> notes.md
          echo >> notes.md
          echo 'Verify with `sha256sum -c SHA256SUMS` (Linux/macOS) or `Get-FileHash` (PowerShell).' >> notes.md
          echo >> notes.md
          echo 'วิธีตรวจโดยละเอียด: [README — ตรวจไฟล์ที่ดาวน์โหลด (SHA-256)](https://github.com/NarDecH/rotate-video#ตรวจไฟล์ที่ดาวน์โหลด-sha-256)' >> notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/RotateVideo.exe dist/RotateVideo-portable.zip dist/SHA256SUMS --clobber
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > live.md
            python - <<'PY'
          from pathlib import Path

          marker = "**SHA-256 checksums**"
          notes = Path("live.md").read_text(encoding="utf-8")
          cut = notes.find(marker)
          if cut != -1:
              notes = notes[:cut].rstrip()
          sums = Path("dist/SHA256SUMS").read_text(encoding="utf-8").strip()
          notes += (
              "\n\n" + marker + " (`SHA256SUMS`)\n\n```\n" + sums + "\n```\n\n"
              "Verify with `sha256sum -c SHA256SUMS` (Linux/macOS) or `Get-FileHash` (PowerShell).\n"
          )
          notes += "\nวิธีตรวจโดยละเอียด: [README — ตรวจไฟล์ที่ดาวน์โหลด (SHA-256)](https://github.com/NarDecH/rotate-video#ตรวจไฟล์ที่ดาวน์โหลด-sha-256)\n"
          Path("notes.md").write_text(notes, encoding="utf-8")
          PY
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/RotateVideo.exe dist/RotateVideo-portable.zip dist/SHA256SUMS \
              --title "Rotate Video $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
